<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Decision Engine JS Playground</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #080d18;
        color: #f5f7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 34px 20px 60px;
        background:
          radial-gradient(circle at 10% 4%, rgba(92, 126, 255, 0.23), transparent 32rem),
          radial-gradient(circle at 90% 88%, rgba(46, 211, 157, 0.13), transparent 30rem),
          #080d18;
      }

      main {
        width: min(1040px, 100%);
        margin: 0 auto;
      }

      header {
        margin-bottom: 25px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #82e7c1;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 4.6rem);
        line-height: 0.95;
        letter-spacing: -0.055em;
      }

      .intro {
        max-width: 680px;
        margin: 18px 0 0;
        color: #aab5d0;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        overflow-x: auto;
        padding: 2px 2px 4px;
        scrollbar-width: none;
      }

      .tab {
        flex: 0 0 auto;
        border: 1px solid #2d3954;
        border-radius: 999px;
        padding: 10px 17px;
        background: rgba(13, 21, 41, 0.8);
        color: #aab5d0;
      }

      .tab[aria-selected="true"] {
        border-color: #7899ff;
        background: #7899ff;
        color: #071029;
      }

      .card {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: clamp(20px, 4vw, 34px);
        background: rgba(18, 25, 45, 0.92);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(18px);
      }

      .mode-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }

      h2 {
        margin: 0;
        font-size: 1.4rem;
      }

      .mode-description {
        margin: 7px 0 0;
        color: #8290af;
        line-height: 1.5;
      }

      .badge {
        border: 1px solid #31405f;
        border-radius: 999px;
        padding: 6px 10px;
        color: #82e7c1;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .field + .field {
        margin-top: 22px;
      }

      label,
      legend {
        display: block;
        margin-bottom: 9px;
        color: #e9edfa;
        font-weight: 750;
      }

      .label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #34415d;
        border-radius: 13px;
        padding: 13px 15px;
        outline: none;
        background: #0b1224;
        color: inherit;
        font: inherit;
        transition: border-color 150ms, box-shadow 150ms;
      }

      textarea {
        min-height: 124px;
        resize: vertical;
        line-height: 1.5;
      }

      #state.batch-input {
        min-height: 190px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      input:focus,
      textarea:focus {
        border-color: #7899ff;
        box-shadow: 0 0 0 4px rgba(120, 153, 255, 0.13);
      }

      fieldset {
        min-width: 0;
        margin: 22px 0 0;
        border: 0;
        padding: 0;
      }

      .criteria {
        display: grid;
        gap: 10px;
      }

      .criterion-row {
        display: grid;
        grid-template-columns: 32px 1fr 40px;
        align-items: center;
        gap: 10px;
      }

      .criterion-number {
        color: #72809f;
        font-size: 0.82rem;
        text-align: center;
      }

      button {
        border: 0;
        border-radius: 11px;
        padding: 11px 18px;
        background: #7899ff;
        color: #071029;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: filter 150ms, transform 150ms, opacity 150ms;
      }

      button:hover:not(:disabled) {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      .secondary,
      .remove {
        background: #26334f;
        color: #cbd4e9;
      }

      .secondary {
        padding: 7px 11px;
        font-size: 0.84rem;
      }

      .remove {
        width: 40px;
        padding: 11px 0;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-top: 24px;
      }

      .hint {
        color: #7784a3;
        font-size: 0.82rem;
      }

      #error {
        margin: 20px 0 0;
        color: #ff9cac;
      }

      #result {
        display: none;
        margin-top: 28px;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
        padding-top: 26px;
      }

      .answer-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
      }

      .answer {
        margin: 3px 0 0;
        color: #82e7c1;
        font-size: 2rem;
        font-weight: 850;
        text-transform: capitalize;
      }

      .confidence {
        color: #aab5d0;
        text-align: right;
      }

      .confidence strong {
        display: block;
        color: #f5f7ff;
        font-size: 1.2rem;
      }

      .probabilities {
        margin-top: 24px;
      }

      .probability {
        display: grid;
        grid-template-columns: minmax(90px, 160px) 1fr 58px;
        align-items: center;
        gap: 12px;
        margin-top: 13px;
      }

      .probability-name {
        overflow: hidden;
        text-overflow: ellipsis;
        text-transform: capitalize;
        white-space: nowrap;
      }

      .track {
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: #29344e;
      }

      .bar {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #7899ff, #82e7c1);
      }

      .timings {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 26px;
      }

      .timing {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 13px;
        padding: 13px;
        background: #0d1529;
      }

      .timing span {
        display: block;
        color: #7784a3;
        font-size: 0.72rem;
        text-transform: uppercase;
      }

      .timing strong {
        display: block;
        margin-top: 5px;
        font-size: 1rem;
      }

      .batch-results {
        display: grid;
        gap: 10px;
        margin-top: 20px;
      }

      .batch-row {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr) minmax(90px, auto) 85px;
        align-items: center;
        gap: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 13px;
        padding: 13px;
        background: #0d1529;
      }

      .batch-state {
        overflow: hidden;
        color: #aab5d0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .batch-answer {
        color: #82e7c1;
        font-weight: 800;
        text-transform: capitalize;
      }

      .batch-time {
        color: #7784a3;
        font-size: 0.78rem;
        text-align: right;
      }

      @media (max-width: 680px) {
        body {
          padding-inline: 12px;
        }

        .actions,
        .answer-header,
        .mode-header {
          align-items: stretch;
          flex-direction: column;
        }

        .confidence {
          text-align: left;
        }

        .timings {
          grid-template-columns: repeat(2, 1fr);
        }

        .batch-row {
          grid-template-columns: 28px 1fr auto;
        }

        .batch-state {
          grid-column: 2 / -1;
          grid-row: 2;
        }

        #submit {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Decision Engine JS · Bun + ONNX</p>
        <h1>Turn text into answers.</h1>
        <p class="intro">
          Choose a workflow, describe the input, and get a fast structured
          result from one local model.
        </p>
      </header>

      <nav class="tabs" role="tablist" aria-label="Decision workflow">
        <button class="tab" type="button" role="tab" data-mode="choose">Choose</button>
        <button class="tab" type="button" role="tab" data-mode="score">Score</button>
        <button class="tab" type="button" role="tab" data-mode="noul">Noul</button>
        <button class="tab" type="button" role="tab" data-mode="route">Route</button>
        <button class="tab" type="button" role="tab" data-mode="batch">Batch</button>
      </nav>

      <section class="card">
        <div class="mode-header">
          <div>
            <h2 id="mode-title"></h2>
            <p id="mode-description" class="mode-description"></p>
          </div>
          <span id="mode-badge" class="badge"></span>
        </div>

        <form id="form">
          <div class="field">
            <label id="state-label" for="state">State or message</label>
            <textarea id="state" maxlength="20000" required></textarea>
            <span id="state-hint" class="hint"></span>
          </div>

          <div class="field">
            <label for="question">Question or criterion</label>
            <input id="question" maxlength="1000" required>
          </div>

          <fieldset id="criteria-field">
            <div class="label-row">
              <legend id="criteria-label">Choices</legend>
              <button id="add-criterion" class="secondary" type="button">+ Add choice</button>
            </div>
            <div id="criteria" class="criteria"></div>
          </fieldset>

          <div class="actions">
            <span class="hint">Runs locally. Press ⌘/Ctrl + Enter.</span>
            <button id="submit" type="submit">Run</button>
          </div>
        </form>

        <p id="error" role="alert" hidden></p>

        <section id="result" aria-live="polite">
          <div id="single-result">
            <div class="answer-header">
              <div>
                <span id="answer-label" class="hint">Answer</span>
                <p id="answer" class="answer"></p>
              </div>
              <div class="confidence">
                Confidence
                <strong id="confidence"></strong>
              </div>
            </div>
            <div id="probabilities" class="probabilities"></div>
          </div>
          <div id="batch-results" class="batch-results"></div>
          <div id="timings" class="timings"></div>
        </section>
      </section>
    </main>

    <script>
      const modes = {
        choose: {
          title: "Choose the best option",
          description: "Compare custom options and return the strongest match.",
          badge: "Choice",
          type: "choice",
          stateLabel: "State or message",
          stateHint: "",
          state: "I was billed twice. Please refund the duplicate.",
          question: "Who should handle this?",
          criteriaLabel: "Choices",
          addLabel: "+ Add choice",
          criteria: ["billing", "technical", "sales"],
          submit: "Run choice",
        },
        score: {
          title: "Score against a scale",
          description: "Estimate a weighted score using your ordered scale levels.",
          badge: "Score",
          type: "score",
          stateLabel: "Text to score",
          stateHint: "Levels must be ordered from lowest to highest.",
          state: "The production database is unavailable for every customer.",
          question: "How urgent is this incident?",
          criteriaLabel: "Scale levels",
          addLabel: "+ Add level",
          criteria: ["not urgent", "normal", "urgent", "critical"],
          submit: "Calculate score",
        },
        noul: {
          title: "Check a Noul condition",
          description: "Ask a direct factual question and return a calibrated false/true probability.",
          badge: "Noul",
          type: "noul",
          stateLabel: "State or message",
          stateHint: "",
          state: "The customer says they cannot sign in after resetting their password.",
          question: "Is the customer experiencing a technical issue?",
          criteriaLabel: "Answer descriptions",
          addLabel: "",
          criteria: ["No, the answer is false", "Yes, the answer is true"],
          submit: "Check condition",
        },
        route: {
          title: "Route work automatically",
          description: "Send a request to the team most suited to handle it.",
          badge: "Routing",
          type: "choice",
          stateLabel: "Incoming request",
          stateHint: "",
          state: "Our team needs SSO enabled before the security review next week.",
          question: "Which team should own this request?",
          criteriaLabel: "Destinations",
          addLabel: "+ Add destination",
          criteria: ["accounts", "billing", "security", "technical support"],
          submit: "Find destination",
        },
        batch: {
          title: "Process many inputs",
          description: "Classify up to 50 lines using the same question and choices.",
          badge: "Batch",
          type: "choice",
          stateLabel: "Inputs — one per line",
          stateHint: "Blank lines are ignored. Each non-empty line becomes one result.",
          state: [
            "I was billed twice for my subscription.",
            "The dashboard stays blank after I sign in.",
            "Can I get a quote for 100 seats?",
          ].join("\n"),
          question: "Which team should handle this?",
          criteriaLabel: "Choices",
          addLabel: "+ Add choice",
          criteria: ["billing", "technical", "sales"],
          submit: "Run batch",
        },
      };

      const form = document.querySelector("#form");
      const state = document.querySelector("#state");
      const stateLabel = document.querySelector("#state-label");
      const stateHint = document.querySelector("#state-hint");
      const question = document.querySelector("#question");
      const criteriaField = document.querySelector("#criteria-field");
      const criteriaLabel = document.querySelector("#criteria-label");
      const criteria = document.querySelector("#criteria");
      const addCriterion = document.querySelector("#add-criterion");
      const submit = document.querySelector("#submit");
      const error = document.querySelector("#error");
      const result = document.querySelector("#result");
      const singleResult = document.querySelector("#single-result");
      const answerLabel = document.querySelector("#answer-label");
      const answer = document.querySelector("#answer");
      const confidence = document.querySelector("#confidence");
      const probabilities = document.querySelector("#probabilities");
      const batchResults = document.querySelector("#batch-results");
      const timings = document.querySelector("#timings");
      const tabs = [...document.querySelectorAll(".tab")];
      let activeMode = "choose";

      function activeConfig() {
        return modes[activeMode];
      }

      function addCriterionRow(value = "") {
        const row = document.createElement("div");
        row.className = "criterion-row";

        const number = document.createElement("span");
        number.className = "criterion-number";

        const input = document.createElement("input");
        input.className = "criterion-input";
        input.placeholder = activeConfig().type === "score" ? "Scale description" : "Choice label";
        input.value = value;
        input.maxLength = 200;
        input.required = true;

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.type = "button";
        remove.textContent = "×";
        remove.title = "Remove";
        remove.addEventListener("click", () => {
          if (criteria.children.length > 2) {
            row.remove();
            updateCriterionRows();
          }
        });

        row.append(number, input, remove);
        criteria.append(row);
        updateCriterionRows();
      }

      function updateCriterionRows() {
        const config = activeConfig();
        const maximum = config.type === "score" ? 10 : 20;
        [...criteria.children].forEach((row, index) => {
          const labels =
            config.type === "noul" ? ["No", "Yes"] : [String(index + 1)];
          row.querySelector(".criterion-number").textContent = labels[index] ?? String(index + 1);
          row.querySelector(".remove").disabled =
            config.type === "noul" || criteria.children.length <= 2;
        });
        addCriterion.disabled = criteria.children.length >= maximum;
      }

      function selectMode(mode) {
        activeMode = mode;
        const config = activeConfig();
        tabs.forEach((tab) => {
          const selected = tab.dataset.mode === mode;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        document.querySelector("#mode-title").textContent = config.title;
        document.querySelector("#mode-description").textContent = config.description;
        document.querySelector("#mode-badge").textContent = config.badge;
        stateLabel.textContent = config.stateLabel;
        stateHint.textContent = config.stateHint;
        state.value = config.state;
        state.classList.toggle("batch-input", mode === "batch");
        state.maxLength = mode === "batch" ? 1000000 : 20000;
        question.value = config.question;
        criteriaLabel.textContent = config.criteriaLabel;
        addCriterion.textContent = config.addLabel;
        addCriterion.hidden = config.type === "noul";
        criteria.replaceChildren();
        config.criteria.forEach(addCriterionRow);
        submit.textContent = config.submit;
        result.style.display = "none";
        error.hidden = true;
      }

      function percent(value) {
        return `${(value * 100).toFixed(1)}%`;
      }

      function timingCard(label, value) {
        const card = document.createElement("div");
        card.className = "timing";
        const name = document.createElement("span");
        name.textContent = label;
        const duration = document.createElement("strong");
        duration.textContent = value === null || value === undefined ? "—" : `${value.toFixed(2)} ms`;
        card.append(name, duration);
        return card;
      }

      function probabilityRow(label, value) {
        const row = document.createElement("div");
        row.className = "probability";
        const name = document.createElement("span");
        name.className = "probability-name";
        name.textContent = label;
        const track = document.createElement("div");
        track.className = "track";
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.width = percent(value);
        track.append(bar);
        const score = document.createElement("span");
        score.textContent = percent(value);
        row.append(name, track, score);
        return row;
      }

      function answerDetails(decision) {
        if (decision.type === "choice") {
          return {
            label: "Selected choice",
            value: decision.choice,
            confidence: decision.confidence,
            probabilities: decision.probabilities,
          };
        }
        if (decision.type === "score") {
          return {
            label: "Weighted score",
            value: decision.score.toFixed(2),
            confidence: decision.confidence,
            probabilities: Object.fromEntries(
              Object.entries(decision.probabilities).map(([level, value]) => [
                decision.legend[level] ?? `Level ${level}`,
                value,
              ]),
            ),
          };
        }
        return {
          label: "Condition result",
          value: decision.noul >= 0.5 ? "Yes" : "No",
          confidence: decision.confidence,
          probabilities: {
            No: 1 - decision.noul,
            Yes: decision.noul,
          },
        };
      }

      function renderSingle(payload) {
        const details = answerDetails(payload.result.answers.decision);
        singleResult.hidden = false;
        batchResults.replaceChildren();
        answerLabel.textContent = details.label;
        answer.textContent = details.value;
        confidence.textContent = percent(details.confidence);
        probabilities.replaceChildren(
          ...Object.entries(details.probabilities)
            .sort(([, left], [, right]) => right - left)
            .map(([label, value]) => probabilityRow(label, value)),
        );
        timings.replaceChildren(
          timingCard("Inference", payload.timing.inferenceMs),
          timingCard("Total request", payload.timing.totalMs),
          timingCard("Model wait", payload.timing.modelWaitMs),
          timingCard("Initial load", payload.timing.modelLoadMs),
        );
      }

      function renderBatch(payload) {
        singleResult.hidden = true;
        batchResults.replaceChildren(
          ...payload.items.map((item, index) => {
            const details = answerDetails(item.result.answers.decision);
            const row = document.createElement("div");
            row.className = "batch-row";
            const number = document.createElement("span");
            number.className = "criterion-number";
            number.textContent = String(index + 1);
            const text = document.createElement("span");
            text.className = "batch-state";
            text.textContent = item.state;
            text.title = item.state;
            const selected = document.createElement("span");
            selected.className = "batch-answer";
            selected.textContent = details.value;
            const duration = document.createElement("span");
            duration.className = "batch-time";
            duration.textContent = `${item.inferenceMs.toFixed(0)} ms`;
            row.append(number, text, selected, duration);
            return row;
          }),
        );
        timings.replaceChildren(
          timingCard("Total batch", payload.timing.totalMs),
          timingCard("Average / item", payload.timing.totalMs / payload.items.length),
          timingCard("Initial load", payload.timing.modelLoadMs),
        );
      }

      function requestBody() {
        const config = activeConfig();
        const values = [...document.querySelectorAll(".criterion-input")].map(
          (input) => input.value,
        );
        const body = {
          state: state.value,
          question: question.value,
          type: config.type,
          criteria:
            config.type === "noul"
              ? { false: values[0], true: values[1] }
              : values,
        };
        if (activeMode === "batch") {
          return {
            ...body,
            states: state.value.split("\n").map((value) => value.trim()).filter(Boolean),
          };
        }
        return body;
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => selectMode(tab.dataset.mode));
        tab.addEventListener("keydown", (event) => {
          if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") {
            return;
          }
          event.preventDefault();
          const direction = event.key === "ArrowRight" ? 1 : -1;
          const index = (tabs.indexOf(tab) + direction + tabs.length) % tabs.length;
          tabs[index].click();
          tabs[index].focus();
        });
      });

      addCriterion.addEventListener("click", () => addCriterionRow());

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const idleLabel = activeConfig().submit;
        error.hidden = true;
        result.style.display = "none";
        submit.disabled = true;
        submit.textContent = "Running…";

        try {
          const batch = activeMode === "batch";
          const response = await fetch(batch ? "/api/batch" : "/api/decide", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody()),
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || `Request failed (${response.status})`);
          }
          batch ? renderBatch(payload) : renderSingle(payload);
          result.style.display = "block";
        } catch (requestError) {
          error.textContent = requestError instanceof Error
            ? requestError.message
            : "Request failed";
          error.hidden = false;
        } finally {
          submit.disabled = false;
          submit.textContent = idleLabel;
        }
      });

      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      selectMode("choose");
    </script>
  </body>
</html>
